<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: Kurzvideo-App. Bildschirmhohe Posts mit Snap, Aktionsspalte rechts, Caption unten links, Navigationsleiste unten. Bewusst nur dunkel. */
:root{
  --ink:#000; --fg:#fff; --muted:rgba(255,255,255,.75); --dim:rgba(255,255,255,.55);
  --heart:#FE2C55; --save:#FACE15; --cyan:#25F4EE; --sheet:#fff; --sheet-fg:#161823; --sheet-muted:#8A8B91;
  --tt:"TikTok Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --nav:52px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--tt);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.top{position:fixed;inset:0 0 auto;z-index:6;display:flex;justify-content:center;align-items:center;gap:18px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-weight:600;font-size:16px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top b{color:var(--fg);position:relative;font-weight:700}
.top b::after{content:"";position:absolute;left:50%;bottom:-7px;width:28px;height:3px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.top .live{position:absolute;left:max(16px,env(safe-area-inset-left,0px));font-size:12px;font-weight:700;color:var(--fg)}
.feed{position:fixed;inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.bg{position:absolute;inset:0}
.bg video,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg img.blur{transform:scale(1.1)}
.bg img.wide{object-fit:contain}
.shade{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.slides::-webkit-scrollbar{display:none}
.slides > *{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden;contain:paint;transform:translateZ(0)}
.dots{position:absolute;z-index:3;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:var(--fg)}
.count{position:absolute;z-index:3;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 52px);
  padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.45);font-size:12px;font-weight:600}
/* Textpost-Hintergruende wie im Foto-Modus */
.t1{background:linear-gradient(160deg,#3A3F47,#121316)}
.t2{background:linear-gradient(200deg,#C7924A,#3B2511)}
.t3{background:linear-gradient(160deg,#9AA3AE,#3A4049 60%,#17191D)}
.t4{background:linear-gradient(170deg,#9B6A55,#2B1810)}
.t5{background:linear-gradient(180deg,#E9EBEE,#8D939B)}
.t6{background:linear-gradient(170deg,#7D4E67,#1F121A)}
.t7{background:#111}
/* TikTok-Textboxen */
.ov{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:76px;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center}
.ov.low{top:auto;bottom:38%}
.ov{transition:opacity .2s}
.ov span{font-weight:700;font-size:clamp(19px,5.4vw,26px);line-height:1.25;padding:3px 10px;border-radius:7px;background:var(--fg);color:#000;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ov.plain span{background:none;color:var(--fg);text-shadow:0 0 3px #000,0 0 3px #000,0 1px 4px rgba(0,0,0,.8)}
.ov.big span{font-size:clamp(26px,8vw,40px);font-weight:800}
.ov.dark span{background:#000;color:var(--fg)}
/* Caption */
.cap{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:84px;bottom:22px;display:grid;gap:5px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.user{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.user em{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.desc{font-size:15px;line-height:1.35;margin:0}
.desc.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc b{font-weight:700}
.more{all:unset;cursor:pointer;font-weight:700;font-size:14px;color:var(--fg)}
.music{display:flex;align-items:center;gap:6px;font-size:14px;overflow:hidden;max-width:230px}
.music .track{white-space:nowrap;animation:marq 9s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* Aktionsspalte */
.rail{position:absolute;z-index:4;right:max(8px,env(safe-area-inset-right,0px));bottom:16px;display:grid;gap:14px;justify-items:center;width:56px}
.rail button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rail button:focus-visible,.gift:focus-visible,.more:focus-visible,.navb:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.rail svg{width:36px;height:36px;fill:var(--fg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));transition:transform .15s}
.rail .liked svg{fill:var(--heart)}
.rail .saved svg{fill:var(--save)}
.rail button:active svg{transform:scale(.85)}
.av{position:relative;width:48px;height:48px;margin-bottom:10px}
.av .pic{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--fg);background:url("media/p025.jpg") center 20%/cover,#555}
.av .plus{all:unset;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--heart);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1;cursor:pointer}
.av .plus.done{background:var(--fg);color:var(--heart)}
.disc{width:44px;height:44px;border-radius:50%;margin-top:6px;background:radial-gradient(circle,#222 30%,#111 31%,#2b2b2b 60%,#111 100%);display:grid;place-items:center;animation:spin 5s linear infinite}
.disc i{width:22px;height:22px;border-radius:50%;background:url("media/p045.jpg") center/cover,#555}
@keyframes spin{to{transform:rotate(360deg)}}
.burst{position:absolute;z-index:5;pointer-events:none;width:96px;height:96px;fill:var(--heart);transform:translate(-50%,-50%) scale(0);animation:pop .8s ease-out forwards}
@keyframes pop{25%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--r,-12deg));opacity:1}100%{transform:translate(-50%,-110%) scale(1.3);opacity:0}}
/* Video */
.prog{position:absolute;z-index:4;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.2)}
.prog i{display:block;height:100%;width:0;background:var(--fg)}
.paused{position:absolute;z-index:3;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);fill:rgba(255,255,255,.8);pointer-events:none}
.mute{all:unset;cursor:pointer;position:absolute;z-index:4;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 52px);
  display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
/* Geschenk */
.gift{position:absolute;z-index:4;left:50%;top:58%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:12px 18px;border-radius:6px;border:0;background:var(--heart);color:var(--fg);font:700 15px var(--tt);cursor:pointer;box-shadow:0 6px 20px rgba(254,44,85,.35)}
.gift svg{width:18px;height:18px;fill:currentColor}
.unlocked{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));right:76px;top:56%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.unlocked span{font-weight:800;font-size:clamp(18px,5vw,24px);padding:3px 10px;border-radius:7px;background:var(--heart);color:var(--fg)}
.unlocked small{font-size:13px;color:var(--muted);text-shadow:0 1px 2px #000}
/* Navigationsleiste */
.nav{position:fixed;z-index:6;inset:auto 0 0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;background:#000;border-top:1px solid #1f1f1f;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.navb{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--dim)}
.navb.on{color:var(--fg)}
.navb svg{width:24px;height:24px;fill:currentColor}
.add{width:44px;height:28px;border-radius:8px;background:var(--fg);position:relative;justify-self:center;box-shadow:-3px 0 0 var(--cyan),3px 0 0 var(--heart);display:grid;place-items:center;color:#000;font-weight:800;font-size:20px;line-height:1}
/* Kommentare */
.sheet{position:fixed;z-index:9;inset:auto 0 0;max-height:62%;background:var(--sheet);color:var(--sheet-fg);border-radius:12px 12px 0 0;
  padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-y:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;text-align:center;font-size:13px;font-weight:600}
.c{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0;font-size:14px;line-height:1.35}
.c .a{width:34px;height:34px;border-radius:50%;background:#E3E3E6;display:grid;place-items:center;font-size:16px}
.c b{display:block;color:var(--sheet-muted);font-size:13px;font-weight:600}
.c small{display:block;color:var(--sheet-muted);font-size:12px;margin-top:3px}
.c .h{color:var(--sheet-muted);font-size:12px;text-align:center}
.close{all:unset;cursor:pointer;display:block;margin:8px auto 0;padding:9px 18px;border-radius:4px;background:#F1F1F2;font-weight:600;font-size:14px}
.toast{position:fixed;z-index:11;left:50%;top:45%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:8px;background:rgba(0,0,0,.8);font-size:14px;font-weight:600;text-align:center;max-width:80%}
.hint{position:fixed;z-index:5;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);display:grid;justify-items:center;gap:6px;
  font-weight:700;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none;animation:bob 1.4s ease-in-out infinite}
.hint svg{width:34px;height:34px;fill:var(--fg)}
@keyframes bob{50%{transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion:reduce){.burst,.hint,.disc,.music .track{animation:none}.sheet{transition:none}}
</style>

const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' Mio.':n>=1e4?(n/1e3).toFixed(1).replace('.',',')+' Tsd.':n.toLocaleString('de-AT');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ov=o=>o?`<div class="ov ${o.cls||''}">${o.lines.map(l=>`<span>${esc(l)}</span>`).join('')}</div>`:'';

const feed=document.getElementById('feed');
POSTS.forEach((p,i)=>{
  const s=document.createElement('section');
  s.className='post';s.setAttribute('aria-label',`Video ${i+1} von ${POSTS.length}`);
  const m=p.media||[];
  const one=x=>x.type==='video'
    ?`<video src="${x.src}" muted loop playsinline preload="metadata"${x.poster?` poster="${x.poster}"`:''}></video>`
    :`<img class="blur" src="${x.src.replace('.jpg','_b.jpg')}" alt="" decoding="async"><img class="photo" src="${x.src}" alt="" decoding="async">`;
  const media=m.length>1?`<div class="slides">${m.map(x=>`<div>${one(x)}</div>`).join('')}</div>`:(m[0]?one(m[0]):'');
  const isVid=m.some(x=>x.type==='video');
  s.innerHTML=`<div class="bg ${p.bg||''}">${media}</div><div class="shade"></div>
  ${ov(p.ov)}${ov(p.ov2)}
  ${m.length>1?`<div class="dots">${m.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div><div class="count">1/${m.length}</div>`:''}
  <button class="mute" aria-label="Ton an">🔇 Ton an</button>${isVid?`<div class="prog"><i></i></div>`:''}
  ${p.audio?`<audio src="${p.audio}" loop preload="none"></audio>`:''}
  ${p.gift?`<button class="gift">${IC.gift}${p.gift.label}</button><div class="unlocked" hidden><span>${esc(p.gift.title)}</span><small>${esc(p.gift.note)}</small></div>`:''}
  <div class="rail">
    <div class="av"><div class="pic" role="img" aria-label="unur"></div><button class="plus" aria-label="Folgen">+</button></div>
    <button class="like" aria-label="Gefällt mir">${IC.heart}<span class="n">${fmt(p.likes)}</span></button>
    <button class="com" aria-label="Kommentare">${IC.com}<span>${p.comments.length}</span></button>
    <button class="save" aria-label="Speichern">${IC.save}<span class="n">${fmt(p.saves)}</span></button>
    <button class="share" aria-label="Teilen">${IC.share}<span>${fmt(p.shares)}</span></button>
    <div class="disc" aria-hidden="true"><i></i></div>
  </div>
  <div class="cap">
    <span class="user">unur <em>· ${p.when}</em></span>
    <p class="desc clip">${esc(p.desc)} <b>${esc(p.tags)}</b></p>
    <button class="more">mehr</button>
    <span class="music">${IC.note}<span style="overflow:hidden"><span class="track">${esc(p.song)} &nbsp;&nbsp;&nbsp; ${esc(p.song)} &nbsp;&nbsp;&nbsp;</span></span></span>
  </div>`;
  feed.appendChild(s);

  const like=s.querySelector('.like'),ln=like.querySelector('.n');
  const setLike=on=>{like.classList.toggle('liked',on);ln.textContent=fmt(p.likes+(on?1:0));};
  like.addEventListener('click',()=>setLike(!like.classList.contains('liked')));
  const save=s.querySelector('.save'),sn=save.querySelector('.n');
  save.addEventListener('click',()=>{const on=!save.classList.contains('saved');save.classList.toggle('saved',on);sn.textContent=fmt(p.saves+(on?1:0));if(on)toast('in „Favoriten“ gespeichert');});
  s.querySelector('.share').addEventListener('click',()=>toast('dieser feed ist nur für dich 🔒'));
  s.querySelector('.com').addEventListener('click',()=>openSheet(p));
  const plus=s.querySelector('.plus');
  plus.addEventListener('click',()=>{document.querySelectorAll('.plus').forEach(b=>{b.classList.add('done');b.textContent='✓';});toast('du folgst unur. schon seit über 10 jahren 🫶');});
  const more=s.querySelector('.more'),desc=s.querySelector('.desc');
  more.addEventListener('click',()=>{const c=desc.classList.toggle('clip');more.textContent=c?'mehr':'weniger';});

  let last=0,timer=null,dx=0,dy=0;
  s.addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY;},{passive:true});
  s.addEventListener('pointerup',e=>{
    if(e.target.closest('button,.rail,.cap,.sheet'))return;
    if(Math.abs(e.clientX-dx)>10||Math.abs(e.clientY-dy)>10)return; // war ein Wischen, kein Tippen
    const now=Date.now();
    if(now-last<300){clearTimeout(timer);setLike(true);
      const b=document.createElementNS('http://www.w3.org/2000/svg','svg');
      b.setAttribute('viewBox','0 0 24 24');b.classList.add('burst');b.style.setProperty('--r',(Math.random()*30-15)+'deg');
      b.innerHTML=IC.heart.replace(/<\/?svg[^>]*>/g,'');
      const r=s.getBoundingClientRect();b.style.left=(e.clientX-r.left)+'px';b.style.top=(e.clientY-r.top)+'px';
      s.appendChild(b);setTimeout(()=>b.remove(),850);
    }else if(isVid){timer=setTimeout(()=>togglePause(s),300);}
    last=now;
  });
  if(p.gift){const g=s.querySelector('.gift'),u=s.querySelector('.unlocked');
    g.addEventListener('click',()=>{g.hidden=true;u.hidden=false;setLike(true);confetti(s);});}
});

// Videos: nur der sichtbare Post spielt; Fortschrittsbalken; Tippen pausiert
let soundOn=false;
function togglePause(s){const v=s.querySelector('video');if(!v)return;let pi=s.querySelector('.paused');
  if(v.paused){v.play().catch(()=>{});pi&&pi.remove();}else{v.pause();if(!pi){s.insertAdjacentHTML('beforeend',IC.play.replace('<svg','<svg class="paused"'));}}}
let current=null;
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting)current=e.target;
  e.target.querySelectorAll('video').forEach(v=>{
    if(e.isIntersecting){v.muted=!soundOn;v.currentTime=0;v.play().catch(()=>{});const pi=e.target.querySelector('.paused');pi&&pi.remove();}else v.pause();
  });
  e.target.querySelectorAll('audio').forEach(a=>{
    if(e.isIntersecting&&soundOn){a.currentTime=0;a.play().catch(()=>{});}else a.pause();
  });
}),{threshold:.6});
document.querySelectorAll('.post').forEach(post=>{
  io.observe(post);
  const v=post.querySelector('video'),bar=post.querySelector('.prog i');
  if(v&&bar)v.addEventListener('timeupdate',()=>{bar.style.width=(v.currentTime/(v.duration||1)*100)+'%';});
  const sl=post.querySelector('.slides'),dots=post.querySelectorAll('.dots i'),cnt=post.querySelector('.count');
  if(sl){let raf=0,lastK=0;sl.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const k=Math.round(sl.scrollLeft/sl.clientWidth);
    if(k!==lastK){lastK=k;dots.forEach((d,j)=>d.classList.toggle('on',j===k));cnt.textContent=`${k+1}/${dots.length}`;const o=post.querySelector('.ov');if(o)o.style.opacity=k?0:1;}});},{passive:true});}
  const mb=post.querySelector('.mute');
  if(mb)mb.addEventListener('click',()=>{soundOn=!soundOn;
    document.querySelectorAll('.mute').forEach(b=>{b.textContent=soundOn?'🔊 Ton aus':'🔇 Ton an';b.setAttribute('aria-label',soundOn?'Ton aus':'Ton an');});
    post.querySelectorAll('video').forEach(x=>{x.muted=!soundOn;x.play().catch(()=>{});});
    post.querySelectorAll('audio').forEach(a=>{if(soundOn)a.play().catch(()=>{});else a.pause();});});
});
document.querySelectorAll('img.photo').forEach(im=>{
  const fit=()=>{if(im.naturalWidth>im.naturalHeight*1.05)im.classList.add('wide');};
  im.complete?fit():im.addEventListener('load',fit);
});

// Kommentare
const sheet=document.getElementById('sheet');
function openSheet(p){
  document.getElementById('sheetTitle').textContent=`${p.comments.length} Kommentar${p.comments.length>1?'e':''}`;
  document.getElementById('sheetBody').innerHTML=p.comments.map(c=>`<div class="c"><span class="a">${c[0]}</span><div><b>${esc(c[1])}</b>${esc(c[2])}<small>${esc(c[3])} · Antworten</small></div><span class="h">♡</span></div>`).join('');
  sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');
}
document.getElementById('closeSheet').addEventListener('click',()=>{sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');});

// Toast, Konfetti, Navigation
const toastEl=document.getElementById('toast');let tt;
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,1800);}
function confetti(s){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.style.cssText='position:absolute;inset:0;z-index:5;pointer-events:none';
  const r=s.getBoundingClientRect();c.width=r.width;c.height=r.height;s.appendChild(c);
  const g=c.getContext('2d'),cols=['#FE2C55','#25F4EE','#fff','#C9CDD3','#FACE15'];
  const ps=Array.from({length:90},()=>({x:r.width/2,y:r.height*.58,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,c:cols[Math.random()*5|0],s:Math.random()*6+3,a:Math.random()*6}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();});
    if(++f<90)requestAnimationFrame(tick);else c.remove();})();
}
document.getElementById('nav-home').addEventListener('click',()=>feed.scrollTo({top:0,behavior:'smooth'}));
document.getElementById('nav-friends').addEventListener('click',()=>toast('1 freund: unur 🫶'));
document.getElementById('nav-add').addEventListener('click',()=>toast('posten kannst du später. heute wirst du gefeiert 🎂'));
document.getElementById('nav-inbox').addEventListener('click',()=>toast('1 neue nachricht: alles gute zum geburtstag ❤️'));
document.getElementById('nav-me').addEventListener('click',()=>toast('@marina · geburtstagskind · 15.11.'));
feed.addEventListener('scroll',()=>{document.getElementById('hint').hidden=feed.scrollTop>40;},{passive:true});
