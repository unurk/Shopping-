<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: Kurzvideo-App. Bildschirmhohe Posts mit Snap, Aktionsspalte rechts, Caption unten links, Navigationsleiste unten. Bewusst nur dunkel. */
:root{
  --ink:#000; --fg:#fff; --muted:rgba(255,255,255,.75); --dim:rgba(255,255,255,.55);
  --heart:#FE2C55; --save:#FACE15; --cyan:#25F4EE; --sheet:#fff; --sheet-fg:#161823; --sheet-muted:#8A8B91;
  --tt:"TikTok Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --nav:52px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--tt);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.top{position:fixed;inset:0 0 auto;z-index:6;display:flex;justify-content:center;align-items:center;gap:18px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-weight:600;font-size:16px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top b{color:var(--fg);position:relative;font-weight:700}
.top b::after{content:"";position:absolute;left:50%;bottom:-7px;width:28px;height:3px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.top .live{position:absolute;left:max(16px,env(safe-area-inset-left,0px));font-size:12px;font-weight:700;color:var(--fg)}
.feed{position:fixed;inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.bg{position:absolute;inset:0}
.bg video,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg video{opacity:0;transition:opacity .25s}
.bg video.on{opacity:1}
.bg img.blur{transform:scale(1.25)}
.bg img.wide{object-fit:contain;transform:scale(1.12)}
.bg.dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32);pointer-events:none}
.shade{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.slides::-webkit-scrollbar{display:none}
.slides > *{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden;contain:paint;transform:translateZ(0)}
.dots{position:absolute;z-index:3;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:var(--fg)}
.count{position:absolute;z-index:3;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 52px);
  padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.45);font-size:12px;font-weight:600}
/* Textpost-Hintergruende wie im Foto-Modus */
.t1{background:linear-gradient(160deg,#3A3F47,#121316)}
.t2{background:linear-gradient(200deg,#C7924A,#3B2511)}
.t3{background:linear-gradient(160deg,#9AA3AE,#3A4049 60%,#17191D)}
.t4{background:linear-gradient(170deg,#9B6A55,#2B1810)}
.t5{background:linear-gradient(180deg,#E9EBEE,#8D939B)}
.t6{background:linear-gradient(170deg,#7D4E67,#1F121A)}
.t7{background:#111}
/* TikTok-Textboxen */
.ov{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:76px;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center}
.ov.low{top:auto;bottom:38%}
.ov.top{top:calc(env(safe-area-inset-top,0px) + 92px)}
.ov{transition:opacity .2s}
.ov span{font-weight:700;font-size:clamp(19px,5.4vw,26px);line-height:1.25;padding:3px 10px;border-radius:7px;background:var(--fg);color:#000;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ov.plain span{background:none;color:var(--fg);text-shadow:0 0 3px #000,0 0 3px #000,0 1px 4px rgba(0,0,0,.8)}
.ov.big span{font-size:clamp(26px,8vw,40px);font-weight:800}
.ov.dark span{background:#000;color:var(--fg)}
/* Caption */
.cap{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:84px;bottom:22px;display:grid;gap:5px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.user{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.user em{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.desc{font-size:15px;line-height:1.35;margin:0}
.desc.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc b{font-weight:700}
.more{all:unset;cursor:pointer;font-weight:700;font-size:14px;color:var(--fg)}
.music{display:flex;align-items:center;gap:6px;font-size:14px;overflow:hidden;max-width:230px}
.music .track{white-space:nowrap;animation:marq 9s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* Aktionsspalte */
.rail{position:absolute;z-index:4;right:max(8px,env(safe-area-inset-right,0px));bottom:16px;display:grid;gap:14px;justify-items:center;width:56px}
.rail button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rail button:focus-visible,.gift:focus-visible,.more:focus-visible,.navb:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.rail svg{width:36px;height:36px;fill:var(--fg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));transition:transform .15s}
.rail .liked svg{fill:var(--heart)}
.rail .saved svg{fill:var(--save)}
.rail button:active svg{transform:scale(.85)}
.av{position:relative;width:48px;height:48px;margin-bottom:10px}
.av .pic{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--fg);background:url("media/avatar.jpg") center/cover,#555}
.av .plus{all:unset;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--heart);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1;cursor:pointer}
.av .plus.done{background:var(--fg);color:var(--heart)}
.disc{width:44px;height:44px;border-radius:50%;margin-top:6px;background:radial-gradient(circle,#222 30%,#111 31%,#2b2b2b 60%,#111 100%);display:grid;place-items:center;animation:spin 5s linear infinite}
.disc i{width:22px;height:22px;border-radius:50%;background:url("media/disc.jpg") center/cover,#555}
@keyframes spin{to{transform:rotate(360deg)}}
.burst{position:absolute;z-index:5;pointer-events:none;width:96px;height:96px;fill:var(--heart);transform:translate(-50%,-50%) scale(0);animation:pop .8s ease-out forwards}
@keyframes pop{25%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--r,-12deg));opacity:1}100%{transform:translate(-50%,-110%) scale(1.3);opacity:0}}
/* Video */
.prog{position:absolute;z-index:4;left:0;right:0;bottom:0;height:26px;touch-action:none;cursor:pointer}
.prog::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.25);transition:height .15s}
.prog i{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--fg);transition:height .15s}
.prog b{position:absolute;bottom:-4px;left:0;width:14px;height:14px;border-radius:50%;background:var(--fg);transform:translateX(-50%);opacity:0;transition:opacity .15s}
.prog.drag::before,.prog.drag i{height:6px}
.prog.drag b{opacity:1;bottom:-4px}
.prog:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.time{position:absolute;z-index:5;left:50%;bottom:90px;transform:translateX(-50%);font:800 30px var(--tt);letter-spacing:.02em;text-shadow:0 1px 6px #000;pointer-events:none;white-space:nowrap}
.time em{font-style:normal;color:var(--dim)}
.post .cap,.post .rail,.post .ov{transition:opacity .15s}
.post.scrub .cap,.post.scrub .rail,.post.scrub .ov{opacity:0}
.paused{position:absolute;z-index:3;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);fill:rgba(255,255,255,.8);pointer-events:none}
.mute{all:unset;cursor:pointer;position:absolute;z-index:4;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 52px);
  display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
/* Geschenk */
.gift{position:absolute;z-index:4;left:50%;top:58%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:12px 18px;border-radius:6px;border:0;background:var(--heart);color:var(--fg);font:700 15px var(--tt);cursor:pointer;box-shadow:0 6px 20px rgba(254,44,85,.35)}
.gift svg{width:18px;height:18px;fill:currentColor}
a.gift{text-decoration:none;top:66%}
.unlocked{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));right:76px;top:56%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.unlocked span{font-weight:800;font-size:clamp(18px,5vw,24px);padding:3px 10px;border-radius:7px;background:var(--heart);color:var(--fg)}
.unlocked small{font-size:13px;color:var(--muted);text-shadow:0 1px 2px #000}
/* Navigationsleiste */
.nav{position:fixed;z-index:6;inset:auto 0 0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;background:#000;border-top:1px solid #1f1f1f;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.navb{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--dim)}
.navb.on{color:var(--fg)}
.navb svg{width:24px;height:24px;fill:currentColor}
.add{width:44px;height:28px;border-radius:8px;background:var(--fg);position:relative;justify-self:center;box-shadow:-3px 0 0 var(--cyan),3px 0 0 var(--heart);display:grid;place-items:center;color:#000;font-weight:800;font-size:20px;line-height:1}
/* Kommentare */
.sheet{position:fixed;z-index:9;inset:auto 0 0;max-height:62%;background:var(--sheet);color:var(--sheet-fg);border-radius:12px 12px 0 0;
  padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-y:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;text-align:center;font-size:13px;font-weight:600}
.c{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0;font-size:14px;line-height:1.35}
.c .a{width:34px;height:34px;border-radius:50%;background:#E3E3E6;display:grid;place-items:center;font-size:16px}
.c b{display:block;color:var(--sheet-muted);font-size:13px;font-weight:600}
.c small{display:block;color:var(--sheet-muted);font-size:12px;margin-top:3px}
.c .h{color:var(--sheet-muted);font-size:12px;text-align:center}
.close{all:unset;cursor:pointer;display:block;margin:8px auto 0;padding:9px 18px;border-radius:4px;background:#F1F1F2;font-weight:600;font-size:14px}
.toast{position:fixed;z-index:11;left:50%;top:45%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:8px;background:rgba(0,0,0,.8);font-size:14px;font-weight:600;text-align:center;max-width:80%}
.hint{position:fixed;z-index:5;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);display:grid;justify-items:center;gap:6px;
  font-weight:700;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none;animation:bob 1.4s ease-in-out infinite}
.hint svg{width:34px;height:34px;fill:var(--fg)}
@keyframes bob{50%{transform:translate(-50%,-10px)}}

/* Wortgitter */
.t8{background:linear-gradient(170deg,#2B3036,#0F1114)}
.game{position:absolute;z-index:4;left:max(14px,env(safe-area-inset-left,0px));right:76px;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:8px;justify-items:center}
.game h4{margin:0;font-size:18px;font-weight:800;text-align:center}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(100%,290px,38vh);aspect-ratio:1;padding:6px;border-radius:12px;background:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
.grid i{display:grid;place-items:center;font-style:normal;font-weight:700;font-size:clamp(14px,4.4vw,19px);color:#111;border-radius:6px;transition:background .1s}
.grid i.sel{background:var(--cyan)}
.grid i.found{background:#FFE3EA;color:var(--heart)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:300px}
.words span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.14)}
.words span.done{background:var(--heart);text-decoration:line-through}
.game .score{font-size:13px;color:var(--muted);font-weight:600}

/* Start, Laden, 2x, Hinweise */
.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.start .card{width:min(100%,340px);display:grid;gap:14px;justify-items:center;text-align:center}
.start .notif{width:100%;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:16px;background:rgba(255,255,255,.12)}
.start .notif i{width:40px;height:40px;border-radius:10px;background:url("media/avatar.jpg") center/cover,#555}
.start .notif b{display:block;font-size:14px}.start .notif span{font-size:13px;color:var(--muted)}
.start .go{all:unset;cursor:pointer;width:100%;box-sizing:border-box;text-align:center;padding:15px;border-radius:8px;background:var(--heart);font-weight:800;font-size:16px}
.start .quiet{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px}
.start .go:focus-visible,.start .quiet:focus-visible,.again:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.post.loading::after{content:"";position:absolute;z-index:3;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid rgba(255,255,255,.25);border-top-color:var(--fg);animation:spin .8s linear infinite;pointer-events:none}
.speed{position:absolute;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);font-weight:800;font-size:14px;pointer-events:none}
.swipehint{position:absolute;z-index:5;left:50%;bottom:170px;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);font-weight:700;font-size:14px;pointer-events:none;animation:nudge 1.2s ease-in-out 3}
@keyframes nudge{50%{translate:-14px 0}}
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.35)}
.again{all:unset;cursor:pointer;position:absolute;z-index:4;left:50%;top:66%;transform:translateX(-50%);padding:12px 18px;border-radius:6px;background:rgba(255,255,255,.14);font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){.burst,.hint,.disc,.music .track{animation:none}.sheet{transition:none}}
</style>

const IC={
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.8-1.3 2.3-2.4 4.4-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
 com:'<svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21.5l4.1-2.1c.9.2 1.9.3 2.9.3 5.5 0 10-3.8 10-8.5S17.5 3 12 3zM7.5 12.8a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg>',
 save:'<svg viewBox="0 0 24 24"><path d="M6 2.5h12a1 1 0 0 1 1 1V22l-7-4.5L5 22V3.5a1 1 0 0 1 1-1z"/></svg>',
 share:'<svg viewBox="0 0 24 24"><path d="M13 4v4.2C6.8 9 3.5 13.4 3 20c2.3-3.4 5.6-5.2 10-5.2V19l8-7.5z"/></svg>',
 gift:'<svg viewBox="0 0 24 24"><path d="M20 7h-2.2A3 3 0 0 0 12 4.4 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3h18V8a1 1 0 0 0-1-1zM9 7a1 1 0 1 1 1-1v1zm5 0V6a1 1 0 1 1 1 1zM4 13v7a1 1 0 0 0 1 1h6v-8zm9 8h6a1 1 0 0 0 1-1v-7h-7z"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
 note:'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17V7h6V3z"/></svg>'
};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' Mio.':n>=1e4?(n/1e3).toFixed(1).replace('.',',')+' Tsd.':n.toLocaleString('de-AT');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ov=o=>o?`<div class="ov ${o.cls||''}">${o.lines.map(l=>`<span>${esc(l)}</span>`).join('')}</div>`:'';

const feed=document.getElementById('feed');
POSTS.forEach((p,i)=>{
  const s=document.createElement('section');
  s.className='post';s.setAttribute('aria-label',`Video ${i+1} von ${POSTS.length}`);
  const m=p.media||[];
  const one=x=>x.type==='video'
    ?`<img class="blur" src="${x.poster}" alt=""><img class="photo vposter" src="${x.poster}" alt=""><video src="${x.src}" muted loop playsinline preload="metadata"${x.poster?` poster="${x.poster}"`:''}></video>`
    :`<img class="blur" src="${x.src.replace('.jpg','_b.jpg')}" alt="" decoding="async"><img class="photo" src="${x.src}" alt="" decoding="async"${i>1?' loading="lazy"':''}>`;
  const media=m.length>1?`<div class="slides">${m.map(x=>`<div>${one(x)}</div>`).join('')}</div>`:(m[0]?one(m[0]):'');
  const isVid=m.some(x=>x.type==='video');
  s.innerHTML=`<div class="bg ${p.bg||''}${p.dim?' dim':''}">${media}</div><div class="shade"></div>
  ${ov(p.ov)}${ov(p.ov2)}
  ${m.length>1?`<div class="dots">${m.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div><div class="count">1/${m.length}</div>`:''}
  <button class="mute" aria-label="Ton an">🔇 Ton an</button>${isVid?`<div class="prog" role="slider" tabindex="0" aria-label="Video vorspulen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><b></b></div><div class="time" hidden></div>`:''}
  ${p.audio?`<audio src="${p.audio}" loop preload="none"></audio>`:''}
  ${p.link?`<a class="gift" href="${p.link.href}" target="_blank" rel="noopener">▶ ${p.link.label}</a>`:''}
  ${p.gift?`<button class="gift">${IC.gift}${p.gift.label}</button><div class="unlocked" hidden><span>${esc(p.gift.title)}</span><small>${esc(p.gift.note)}</small></div>`:''}
  <div class="rail">
    <div class="av"><div class="pic" role="img" aria-label="unur"></div><button class="plus" aria-label="Folgen">+</button></div>
    <button class="like" aria-label="Gefällt mir">${IC.heart}<span class="n">${fmt(p.likes)}</span></button>
    <button class="com" aria-label="Kommentare">${IC.com}<span>${p.comments.length}</span></button>
    <button class="save" aria-label="Speichern">${IC.save}<span class="n">${fmt(p.saves)}</span></button>
    <button class="share" aria-label="Teilen">${IC.share}<span>${fmt(p.shares)}</span></button>
    <div class="disc" aria-hidden="true"><i></i></div>
  </div>
  <div class="cap">
    <span class="user">unur <em>· ${p.when}</em></span>
    <p class="desc clip">${esc(p.desc)} <b>${esc(p.tags)}</b></p>
    <button class="more">mehr</button>
    <span class="music">${IC.note}<span style="overflow:hidden"><span class="track">${esc(p.song)} &nbsp;&nbsp;&nbsp; ${esc(p.song)} &nbsp;&nbsp;&nbsp;</span></span></span>
  </div>`;
  feed.appendChild(s);
  if(p.game)buildGame(s,p.game);

  const like=s.querySelector('.like'),ln=like.querySelector('.n');
  const setLike=on=>{like.classList.toggle('liked',on);ln.textContent=fmt(p.likes+(on?1:0));};
  like.addEventListener('click',()=>setLike(!like.classList.contains('liked')));
  const save=s.querySelector('.save'),sn=save.querySelector('.n');
  save.addEventListener('click',()=>{const on=!save.classList.contains('saved');save.classList.toggle('saved',on);sn.textContent=fmt(p.saves+(on?1:0));if(on)toast('gespeichert');});
  s.querySelector('.share').addEventListener('click',()=>toast('nur für dich.'));
  s.querySelector('.com').addEventListener('click',()=>openSheet(p));
  const plus=s.querySelector('.plus');
  plus.addEventListener('click',()=>{document.querySelectorAll('.plus').forEach(b=>{b.classList.add('done');b.textContent='✓';});toast('du folgst unur. seit über 10 jahren.');});
  const more=s.querySelector('.more'),desc=s.querySelector('.desc');
  more.addEventListener('click',()=>{const c=desc.classList.toggle('clip');more.textContent=c?'mehr':'weniger';});

  let last=0,timer=null,dx=0,dy=0;
  s.addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY;},{passive:true});
  s.addEventListener('pointerup',e=>{
    if(e.target.closest('button,.rail,.cap,.sheet,.prog,.game'))return;
    if(Math.abs(e.clientX-dx)>10||Math.abs(e.clientY-dy)>10)return; // war ein Wischen, kein Tippen
    if(s.dataset.lp){delete s.dataset.lp;return;} // war Gedrückthalten (2x)
    const now=Date.now();
    if(now-last<300){clearTimeout(timer);setLike(true);
      const b=document.createElementNS('http://www.w3.org/2000/svg','svg');
      b.setAttribute('viewBox','0 0 24 24');b.classList.add('burst');b.style.setProperty('--r',(Math.random()*30-15)+'deg');
      b.innerHTML=IC.heart.replace(/<\/?svg[^>]*>/g,'');
      const r=s.getBoundingClientRect();b.style.left=(e.clientX-r.left)+'px';b.style.top=(e.clientY-r.top)+'px';
      s.appendChild(b);setTimeout(()=>b.remove(),850);
    }else if(isVid){timer=setTimeout(()=>togglePause(s),300);}
    last=now;
  });
  if(p.gift){const g=s.querySelector('.gift'),u=s.querySelector('.unlocked');
    g.addEventListener('click',()=>{g.hidden=true;u.hidden=false;setLike(true);confetti(s);});}
});

// Videos: nur der sichtbare Post spielt; Fortschrittsbalken; Tippen pausiert
let soundOn=false;
function togglePause(s){const v=s.querySelector('video');if(!v)return;let pi=s.querySelector('.paused');
  if(v.paused){v.play().catch(()=>{});pi&&pi.remove();}else{v.pause();if(!pi){s.insertAdjacentHTML('beforeend',IC.play.replace('<svg','<svg class="paused"'));}}}
let current=null;
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting)current=e.target;
  e.target.querySelectorAll('video').forEach(v=>{
    if(e.isIntersecting){v.muted=!soundOn;v.currentTime=0;v.play().catch(()=>{});const pi=e.target.querySelector('.paused');pi&&pi.remove();}else v.pause();
  });
  e.target.querySelectorAll('audio').forEach(a=>{
    if(e.isIntersecting&&soundOn){a.currentTime=0;a.play().catch(()=>{});}else a.pause();
  });
}),{threshold:.6});
document.querySelectorAll('.post').forEach(post=>{
  io.observe(post);
  const v=post.querySelector('video'),bar=post.querySelector('.prog i');
  if(v&&bar){
    const prog=post.querySelector('.prog'),knob=prog.querySelector('b'),tl=post.querySelector('.time');
    const mmss=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
    let dragging=false,wasPlaying=false;
    const draw=f=>{const pc=(f*100).toFixed(2)+'%';bar.style.width=pc;knob.style.left=pc;prog.setAttribute('aria-valuenow',Math.round(f*100));};
    (function loop(){if(!dragging&&v.duration)draw(v.currentTime/v.duration);requestAnimationFrame(loop);})();
    const seekTo=x=>{const r=prog.getBoundingClientRect(),f=Math.min(1,Math.max(0,(x-r.left)/r.width));
      if(v.duration){v.currentTime=f*v.duration;tl.innerHTML=`${mmss(f*v.duration)} <em>/ ${mmss(v.duration)}</em>`;}draw(f);};
    prog.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();dragging=true;wasPlaying=!v.paused;v.pause();
      prog.setPointerCapture(e.pointerId);prog.classList.add('drag');post.classList.add('scrub');tl.hidden=false;seekTo(e.clientX);});
    prog.addEventListener('pointermove',e=>{if(dragging)seekTo(e.clientX);});
    const end=()=>{if(!dragging)return;dragging=false;prog.classList.remove('drag');post.classList.remove('scrub');tl.hidden=true;
      if(wasPlaying){v.play().catch(()=>{});const pi=post.querySelector('.paused');pi&&pi.remove();}};
    prog.addEventListener('pointerup',end);prog.addEventListener('pointercancel',end);
    prog.addEventListener('keydown',e=>{if(!v.duration)return;
      if(e.key==='ArrowRight'){v.currentTime=Math.min(v.duration,v.currentTime+3);e.preventDefault();}
      if(e.key==='ArrowLeft'){v.currentTime=Math.max(0,v.currentTime-3);e.preventDefault();}});

  const sl=post.querySelector('.slides'),dots=post.querySelectorAll('.dots i'),cnt=post.querySelector('.count');
  if(sl){let raf=0,lastK=0;sl.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const k=Math.round(sl.scrollLeft/sl.clientWidth);

  const mb=post.querySelector('.mute');
  if(mb)mb.addEventListener('click',()=>{soundOn=!soundOn;
    document.querySelectorAll('.mute').forEach(b=>{b.textContent=soundOn?'🔊 Ton aus':'🔇 Ton an';b.setAttribute('aria-label',soundOn?'Ton aus':'Ton an');});
    post.querySelectorAll('video').forEach(x=>{x.muted=!soundOn;x.play().catch(()=>{});});
    post.querySelectorAll('audio').forEach(a=>{if(soundOn)a.play().catch(()=>{});else a.pause();});});
});

// Wortgitter: Wörter durch Wischen über die Buchstaben finden (waagrecht, senkrecht, diagonal, auch rückwärts)
function buildGame(s,cfg){
  const N=8, words=cfg.words.map(w=>w.toUpperCase());
  let seed=cfg.seed||7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const g=Array.from({length:N},()=>Array(N).fill(''));
  const dirs=[[0,1],[1,0],[1,1],[-1,1],[0,-1],[1,-1]];
  for(const w of [...words].sort((a,b)=>b.length-a.length)){
    for(let t=0;t<500;t++){const [dr,dc]=dirs[Math.floor(rnd()*dirs.length)],r=Math.floor(rnd()*N),c=Math.floor(rnd()*N);
      const er=r+dr*(w.length-1),ec=c+dc*(w.length-1); if(er<0||er>=N||ec<0||ec>=N)continue;
      let ok=true;for(let k=0;k<w.length;k++){const x=g[r+dr*k][c+dc*k];if(x&&x!==w[k]){ok=false;break;}}
      if(!ok)continue;for(let k=0;k<w.length;k++)g[r+dr*k][c+dc*k]=w[k];break;}
  }
  const AB='ABCDEFGHIKLMNOPRSTUW';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=AB[Math.floor(rnd()*AB.length)];
  const box=document.createElement('div');box.className='game';
  box.innerHTML=`<h4>${esc(cfg.title)}</h4><div class="grid" role="grid" aria-label="Buchstabengitter">${g.flat().map((ch,i)=>`<i data-i="${i}">${ch}</i>`).join('')}</div>
    <div class="words">${words.map(w=>`<span data-w="${w}">${w.toLowerCase()}</span>`).join('')}</div><div class="score">0/${words.length} gefunden</div>`;
  s.appendChild(box);
  const grid=box.querySelector('.grid'),cells=[...grid.children],found=new Set();let start=null,path=[];
  const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===grid?+el.dataset.i:null;};
  const line=(a,b)=>{const r0=a/N|0,c0=a%N,r1=b/N|0,c1=b%N,dr=Math.sign(r1-r0),dc=Math.sign(c1-c0),n=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));
    if(!(r0===r1||c0===c1||Math.abs(r1-r0)===Math.abs(c1-c0)))return null;return Array.from({length:n+1},(_,k)=>(r0+dr*k)*N+c0+dc*k);};
  const paint=()=>cells.forEach((c,i)=>c.classList.toggle('sel',path.includes(i)));
  grid.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const i=at(e);if(i==null)return;start=i;path=[i];grid.setPointerCapture(e.pointerId);paint();});
  grid.addEventListener('pointermove',e=>{if(start==null)return;const i=at(e);if(i==null)return;const l=line(start,i);if(l){path=l;paint();}});
  const end=e=>{if(start==null)return;e.stopPropagation();const w=path.map(i=>g.flat()[i]).join(''),rw=[...w].reverse().join('');
    const hit=words.find(x=>!found.has(x)&&(x===w||x===rw));
    if(hit){found.add(hit);path.forEach(i=>cells[i].classList.add('found'));box.querySelector(`[data-w="${hit}"]`).classList.add('done');
      box.querySelector('.score').textContent=`${found.size}/${words.length} gefunden`;
      if(found.size===words.length){confetti(s);toast(cfg.done);}}
    start=null;path=[];paint();};
  grid.addEventListener('pointerup',end);grid.addEventListener('pointercancel',end);
}

const toastEl=document.getElementById('toast');let tt;
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,1800);}
function confetti(s){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.style.cssText='position:absolute;inset:0;z-index:5;pointer-events:none';
  const r=s.getBoundingClientRect();c.width=r.width;c.height=r.height;s.appendChild(c);
  const g=c.getContext('2d'),cols=['#FE2C55','#25F4EE','#fff','#C9CDD3','#FACE15'];
  const ps=Array.from({length:90},()=>({x:r.width/2,y:r.height*.58,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,c:cols[Math.random()*5|0],s:Math.random()*6+3,a:Math.random()*6}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();});
    if(++f<90)requestAnimationFrame(tick);else c.remove();})();
}

  document.querySelectorAll('.mute').forEach(b=>{b.textContent=on?'🔊 Ton aus':'🔇 Ton an';b.setAttribute('aria-label',on?'Ton aus':'Ton an');});
  if(current){current.querySelectorAll('video').forEach(v=>{v.muted=!on;v.play().catch(()=>{});});

// Fortschritt merken (Likes, Gespeichert, Geschenke, Folgen) – nur auf diesem Gerät
const KEY='marina-feed-v2';
const st=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}})();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
st.like=st.like||{};st.save=st.save||{};st.gift=st.gift||{};
posts.forEach((post,i)=>{
  const like=post.querySelector('.like'),save=post.querySelector('.save'),gift=post.querySelector('.gift:not(a)'),un=post.querySelector('.unlocked');
  if(st.like[i])like.click(); if(st.save[i]){save.classList.add('saved');}
  if(gift&&st.gift[i]){gift.hidden=true;un.hidden=false;}
  like.addEventListener('click',()=>setTimeout(()=>{st.like[i]=like.classList.contains('liked');if(st.like[i])vib(12);persist();}));
  save.addEventListener('click',()=>setTimeout(()=>{st.save[i]=save.classList.contains('saved');persist();}));
  if(gift)gift.addEventListener('click',()=>{st.gift[i]=1;vib([20,40,20]);persist();});
  // Doppeltipp-Like ebenfalls merken
  new MutationObserver(()=>{const on=like.classList.contains('liked');if(!!st.like[i]!==on){st.like[i]=on;persist();}}).observe(like,{attributes:true,attributeFilter:['class']});
});

// Nächsten Beitrag vorladen, aktuellen Beitrag vollständig laden
const warm=post=>{if(!post)return;post.querySelectorAll('img[loading="lazy"]').forEach(im=>im.loading='eager');
  post.querySelectorAll('video').forEach(v=>{if(v.preload!=='auto')v.preload='auto';});
  post.querySelectorAll('audio').forEach(a=>{if(a.preload!=='auto')a.preload='auto';});};
const warmIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){warm(e.target);let n=e.target.nextElementSibling;warm(n);warm(n&&n.nextElementSibling);}}),{threshold:.6});
posts.forEach(p=>warmIO.observe(p));

// Gedrückthalten = 2x Tempo (wie in der App)
posts.forEach(post=>{const v=post.querySelector('video');if(!v)return;let t=null,badge=null;
  post.addEventListener('pointerdown',e=>{if(e.target.closest('button,.rail,.cap,.prog,a'))return;
    t=setTimeout(()=>{post.dataset.lp='1';v.playbackRate=2;badge=document.createElement('div');badge.className='speed';badge.textContent='2× ⏩';post.appendChild(badge);vib(8);},450);});
  const up=()=>{clearTimeout(t);if(badge){badge.remove();badge=null;v.playbackRate=1;}};
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>post.addEventListener(ev,up));});

// Hinweis beim ersten Karussell
let hinted=(()=>{try{return localStorage.getItem('marina-feed-hint')==='1';}catch(e){return false;}})();
const hintIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting||hinted||!e.target.querySelector('.slides'))return;
  hinted=true;try{localStorage.setItem('marina-feed-hint','1');}catch(x){}
  const h=document.createElement('div');h.className='swipehint';h.textContent='← zur seite wischen';e.target.appendChild(h);setTimeout(()=>h.remove(),3800);}),{threshold:.7});

// Tastatur (Computer): ↑↓ blättern, ←→ Karussell, Leertaste Pause, m Ton
document.addEventListener('keydown',e=>{
  if(!startEl.hidden){if(e.key==='Enter'){begin(true);e.preventDefault();}return;}
  if(e.target.closest&&e.target.closest('.prog'))return;
  const i=Math.max(0,posts.indexOf(current));
  if(e.key==='ArrowDown'||e.key==='j'){posts[Math.min(posts.length-1,i+1)].scrollIntoView({behavior:'smooth'});e.preventDefault();}
  else if(e.key==='ArrowUp'||e.key==='k'){posts[Math.max(0,i-1)].scrollIntoView({behavior:'smooth'});e.preventDefault();}
  else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&current){const sl=current.querySelector('.slides');if(sl){sl.scrollBy({left:(e.key==='ArrowRight'?1:-1)*sl.clientWidth,behavior:'smooth'});e.preventDefault();}}
  else if(e.key===' '&&current&&current.querySelector('video')){togglePause(current);e.preventDefault();}
  else if(e.key==='m'){setSound(!soundOn);}
  else if(e.key==='Escape'){closeSheet();}
});
